# Local hooks only: they call the project's own tools, so pre-commit downloads no hook environments.
# Install once: uv run --project worker pre-commit install
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run --project worker ruff check
        language: system
        types: [python]
        files: ^worker/
      - id: ruff-format
        name: ruff format
        entry: uv run --project worker ruff format --check
        language: system
        types: [python]
        files: ^worker/
      - id: svelte-check
        name: svelte-check
        entry: npm --prefix app run check
        language: system
        files: ^app/(src/|tsconfig|vite|vitest|svelte)
        pass_filenames: false
