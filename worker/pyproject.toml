[project]
name = "propbench"
version = "0.0.1"
description = "PropBench science worker: thermophysical property models of new fluids"
readme = "README.md"
license = "MIT"
requires-python = "==3.12.*"
dependencies = [
    "CoolProp==8.0.0",
    "numpy>=2.0",
    "openpyxl==3.1.5",
    "pint==0.26.1",
    "scipy==1.18.1",
    "uv==0.8.17",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "hypothesis",
]
# FeOs (PC-SAFT, entropy scaling) is an on-demand component (README §2b): installed for development and CI, not bundled
# in the installer until the component manager exists (M1b).
feos = [
    "feos==0.10.1",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-managed"
default-groups = ["dev", "feos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "feos: needs the optional FeOs backend (dependency group 'feos')",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT"]
# Greek letters are the physical symbols (ρ density, σ surface tension, µ micro).
allowed-confusables = ["ρ", "σ", "µ", "μ", "∗", "·", "ν", "γ", "×", "–", "−"]

[tool.ruff.format]
quote-style = "double"
