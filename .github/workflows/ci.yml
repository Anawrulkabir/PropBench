name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  UV_VERSION: "0.8.17"
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint (fmt, ruff, svelte-check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - run: uv sync --project worker --frozen
      - run: uv run --project worker ruff check worker
      - run: uv run --project worker ruff format --check worker
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run check
        working-directory: app

  build:
    name: Build and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04 # oldest supported glibc, so the AppImage runs on more distributions
            python: app/src-tauri/resources/python/bin/python3
          - name: windows-x64
            os: windows-2025
            python: app/src-tauri/resources/python/python.exe
          - name: macos-arm64
            os: macos-15
            python: app/src-tauri/resources/python/bin/python3
          - name: macos-x64
            os: macos-15-intel
            python: app/src-tauri/resources/python/bin/python3
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Linux build prerequisites (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev \
            patchelf file libfuse2

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            !target/release/bundle/
            !target/release/python/
            !target/python-bundle/
          key: cargo-${{ matrix.name }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ matrix.name }}-
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Python worker: uv-managed Python only (never the runner's system Python).
      - run: uv sync --project worker --frozen
      - name: Python tests (pytest, includes the acceptance value)
        run: uv run --project worker pytest

      # UI: install, build (catches bundler errors early) and unit tests.
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: UI tests (vitest)
        run: npm test
        working-directory: app

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests (engine, end-to-end RPC, CLI, Tauri IPC) against worker/.venv
        run: cargo test --workspace

      - name: Build app and unsigned installers (bundles the standalone Python)
        run: npm run tauri build -- --config src-tauri/tauri.bundle.conf.json
        working-directory: app
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: End-to-end RPC and CLI tests against the bundled Python
        env:
          PB_WORKER_PYTHON: ${{ github.workspace }}/${{ matrix.python }}
        run: cargo test -p pb-engine --test e2e_property && cargo test -p pb-cli

      - name: Checksums
        working-directory: target/release/bundle
        run: |
          files=$(find . -maxdepth 2 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \))
          if command -v sha256sum >/dev/null; then sha256sum $files; else shasum -a 256 $files; fi | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: propbench-${{ matrix.name }}-unsigned
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/SHA256SUMS.txt
