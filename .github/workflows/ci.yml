name: CI

on:
  # Push only on main: a pull-request commit gets one run (the pull_request event), not two competing for the same
  # scarce macOS runner. Branches without a PR can run CI by hand (workflow_dispatch).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  UV_VERSION: "0.8.17"
  NODE_VERSION: "22"

jobs:
  build:
    name: Lint, build and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        # All supported platforms (README §4e). Lint runs in one job only (lint: true).
        include:
          - name: macos-arm64
            os: macos-15
            lint: true
          - name: macos-x64
            os: macos-15-intel
          - name: linux-x64
            os: ubuntu-22.04 # oldest supported glibc, so the AppImage runs on more distributions
          - name: windows-x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Linux build prerequisites (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev \
            patchelf file libfuse2

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - name: Lint - rustfmt
        if: matrix.lint
        run: cargo fmt --all -- --check
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            !target/release/bundle/
            !target/release/python/
            !target/python-bundle/
            !target/installed/
          key: cargo-${{ matrix.name }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ matrix.name }}-
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Python worker: uv-managed Python only (never the runner's system Python).
      - run: uv sync --project worker --frozen
      - name: Lint - ruff
        if: matrix.lint
        run: |
          uv run --project worker ruff check worker
          uv run --project worker ruff format --check worker
      - name: Python tests (pytest, includes the acceptance value)
        run: uv run --project worker pytest worker
        env:
          PB_REQUIRE_FEOS: "1" # the FeOs cross-check must run in CI, never skip

      # UI: install, build (catches bundler errors early) and unit tests.
      - run: npm ci
        working-directory: app
      - name: Lint - svelte-check
        if: matrix.lint
        run: npm run check
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: UI tests (vitest)
        run: npm test
        working-directory: app

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests (engine, end-to-end RPC, CLI, Tauri IPC) against worker/.venv
        run: cargo test --workspace

      - name: Build app and unsigned installers (bundles the standalone Python)
        run: npm run tauri build -- --config src-tauri/tauri.bundle.conf.json
        working-directory: app
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"

      # Install/unpack the real installers (silent per-user NSIS install, mounted DMG with signature check, extracted
      # .deb and AppImage) and run the end-to-end RPC and CLI tests against the Python inside each one.
      - name: End-to-end RPC and CLI tests against the Python inside the installers
        run: scripts/ci/test-installers.sh

      - name: Checksums
        working-directory: target/release/bundle
        run: |
          files=$(find . -maxdepth 2 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \))
          if command -v sha256sum >/dev/null; then sha256sum $files; else shasum -a 256 $files; fi | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: propbench-${{ matrix.name }}-unsigned
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/SHA256SUMS.txt
