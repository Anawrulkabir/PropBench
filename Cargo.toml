[workspace]
resolver = "3"
members = ["crates/pb-engine", "crates/pb-cli", "app/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/anawrulkabir/PropBench"
rust-version = "1.97"

[workspace.dependencies]
pb-engine = { path = "crates/pb-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
tokio = { version = "1", default-features = false }
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
